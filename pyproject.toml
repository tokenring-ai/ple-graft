[project]
name = "ple-graft"
version = "0.1.0"
description = "Graft Qwen3.8-Flash-Next PLE n-gram memory onto Qwen3.5-4B and Qwen3.6-35B-A3B"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "safetensors>=0.4",
    "tokenizers>=0.21",
    "pyyaml>=6.0",
    "huggingface-hub>=0.30",
    "datasets>=3.0",
    "tqdm>=4.66",
    "torch>=2.8",
    "transformers>=5.12",
    "accelerate>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ple_graft"]

[tool.hatch.build.targets.wheel.sources]
"src/ple_graft" = "ple_graft"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
